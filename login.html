<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrandStay Hotel - Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <main class="login-card">
        <h1>GrandStay Hotel</h1>
        <p class="login-subtitle">Sign in to manage hotel reservations.</p>

        <form id="loginForm">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter your email" autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>

            <button id="loginButton" type="submit" class="button login-button">Login</button>
        </form>

        <p id="message" class="message error-message" role="alert"></p>

        <div class="demo-box">
            <strong>Demo accounts</strong>
            <p>User: user@hotel.local / User123!</p>
            <p>Admin: admin@hotel.local / Admin123!</p>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
